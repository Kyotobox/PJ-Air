include: package:lints/recommended.yaml
analyzer:
  exclude: [ "**/build/**", "**/.dart_tool/**", "vault/runtime/**", "packages/**", "axis_hud/**", "apps/**", "base2/**" ]
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false
linter:
  rules:
    - always_specify_types
    - unawaited_futures
    - avoid_relative_lib_imports # Refuerza Regla 15 (Aislamiento)
    - test_types_in_equals
    - prefer_const_constructors
